<style>
:root{--red:#E3141B;--red2:#C80F16;--plum:#4A1A5C;--ink:#1D1D22;--ink2:#5B5B66;--ink3:#9A9AA5;--line:#ECECF0;--bg:#F5F6F8;--card:#fff;--green:#14A44D;--amber:#F2A100;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#2a2a33;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;gap:28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.phone{width:375px;height:812px;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 10px #111,0 0 0 11px #333}

.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:110px;animation:in .22s ease}
.screen::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.status{height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600;position:relative;z-index:3}
.status.light{color:#fff}
.grad{background:linear-gradient(120deg,#F0262D 0%,#D3121A 45%,#7A1B52 85%,#4A1A5C 100%);color:#fff}

.appbar h1{font-size:17px;font-weight:700}
.icbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.icbtn.dark{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.top{border-radius:0 0 0 0}
.wrap{padding:0 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(20,20,40,.04);border:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;font-weight:700;font-size:15px}
.sec-h a{font-size:12px;color:var(--red);font-weight:600;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:15px}
.btn:disabled{background:#F7A6A9;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.grey{background:#F1F1F4;color:var(--ink)}
.footer{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 26px;background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.muted{color:var(--ink2)}.small{font-size:12px}.xs{font-size:11px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.row{display:flex;align-items:center;gap:12px}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.list .item+.item{border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:14px}
.sub{font-size:11px;color:var(--ink3);margin-top:3px;display:flex;gap:6px;align-items:center}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ink3)}
.chip{padding:8px 14px;border-radius:999px;background:#F1F1F4;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--red);color:#fff}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;height:38px;border-radius:999px;font-weight:600;font-size:14px}
.seg button.on{background:var(--red);color:#fff}
.search{display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 13px;background:#fff}
.search input{border:0;outline:0;flex:1;font-size:14px;background:none}
.field{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#fff;cursor:pointer}
.field label{display:block;font-size:11px;color:var(--ink3);margin-bottom:3px}
.field input{border:0;outline:0;width:100%;font-size:15px;font-weight:600;background:none}
.nav{position:absolute;left:16px;right:16px;bottom:22px;height:66px;background:#fff;border-radius:999px;box-shadow:0 8px 30px rgba(20,20,40,.12);display:flex;align-items:center;justify-content:space-around;padding:0 10px;z-index:6}
.nav button{height:42px;min-width:42px;border-radius:999px;display:flex;align-items:center;gap:6px;justify-content:center;color:#A3A3AD;font-weight:700;font-size:13px}
.nav button.on{background:var(--red);color:#fff;padding:0 16px}
.sheet-bg{position:absolute;inset:0;background:rgba(15,15,25,.5);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.sheet-bg.center{align-items:center;justify-content:center;padding:24px}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:10px 16px 28px;max-height:86%;overflow:auto;animation:up .25s ease}
.sheet-bg.center .sheet{border-radius:24px;animation:pop .2s}

@keyframes pop{from{transform:scale(.94);opacity:0}}
.grab{width:40px;height:4px;border-radius:9px;background:#DADAE0;margin:0 auto 14px}
.sheet h3{text-align:center;font-size:16px;margin-bottom:14px}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer}

.kv{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}.kv span:first-child{color:var(--ink3)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:#FFE8E9;color:var(--red)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:16px 8px}
.qa div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;position:relative}
.qa i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-style:normal}
.hl{position:absolute;top:-6px;right:6px;background:var(--amber);color:#fff;font-size:8px;padding:2px 5px;border-radius:6px}
.toast{position:absolute;left:16px;right:16px;top:44px;background:#1D1D22;color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;z-index:40;animation:pop .2s}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 24px}
.pinpad button{height:60px;font-size:24px;font-weight:600;border-radius:14px}
.pinpad button:active{background:#EEE}
.dots{display:flex;gap:14px;justify-content:center;margin:26px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #CFCFD6}
.dots i.f{background:var(--red);border-color:var(--red)}
.bubble{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px;font-size:13px;line-height:1.45;max-width:260px}
.bubble.me{background:var(--red);color:#fff;border:0;border-radius:16px 4px 16px 16px;margin-left:auto}
.sug{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;margin-top:8px;width:260px;cursor:pointer}
.composer{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px 24px;display:flex;gap:10px;align-items:center;z-index:5}
.composer input{flex:1;height:44px;border:1px solid var(--line);border-radius:999px;padding:0 16px;outline:0}
.mention{position:absolute;left:74px;bottom:80px;width:227px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;z-index:6}
.mention .item{padding:8px;border-radius:10px}.mention .item:hover{background:#F6F6F8}
.skel{background:linear-gradient(90deg,#EEE 25%,#F6F6F6 50%,#EEE 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.demo{width:260px;color:#ddd;font-size:12px;align-self:center}
.demo h4{color:#fff;font-size:14px;margin-bottom:4px}
.demo p{color:#999;margin-bottom:14px;line-height:1.5}
.demo .g{margin-bottom:14px}
.demo .g b{display:block;color:#bbb;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.demo button{display:block;width:100%;text-align:left;background:#3a3a45;color:#eee;border-radius:8px;padding:8px 10px;margin-bottom:5px;font-size:12px}
.demo button:hover{background:#4a4a58}
.demo button.on{background:var(--red)}
.tog{width:44px;height:26px;border-radius:99px;background:#D6D6DC;position:relative;flex:none;cursor:pointer;transition:.2s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--red)}.tog.on::after{left:21px}
.menu .mi{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;font-size:14px}
.menu .mi+.mi{border-top:1px solid var(--line)}
.mi .ico{width:36px;height:36px;border-radius:10px;background:#FFF1F1;display:grid;place-items:center;color:var(--red)}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.bar.r{background:#F1F1F4}.bar.r i{background:linear-gradient(90deg,#F7931E,var(--red))}
svg{display:block}
</style>
</head>

function mentionPick(no){const p=SAVED.find(x=>x.no===no);S.ci=S.ci.replace(/@\w*$/,'@'+p.n+' ');S.mq=null;S.pick=p;paint();focusC()}
function chatSend(){const v=S.ci.trim();if(!v)return;S.chat.push({me:1,t:v});S.ci='';S.mq=null;
 const am=v.match(/(\d[\d.]*)\s*(rb|ribu|k|jt|juta)?\b/i)||[];const amt=+(am[1]||'0').replace(/\./g,'');const unit=am[2];
 const a=unit?/j/i.test(unit)?amt*1e6:amt*1e3:amt;const p=S.pick||SAVED.find(x=>v.toLowerCase().includes(x.n.toLowerCase()));
 if(/transfer|kirim/i.test(v)&&p&&a){S.chat.push({t:`Siap! Transfer <b>${rp(a)}</b> ke <b>${p.n}</b> (${p.b} · ${p.no}). <div class="sug" style="width:auto;margin-top:10px;justify-content:center;color:var(--red);font-weight:700" onclick="S.tx=newTx();S.tx.to=SAVED.find(x=>x.no==='${p.no}');S.tx.amount=${a};go('tamount')">Lanjutkan transfer →</div>`});S.pick=null}
 else if(/transfer|kirim/i.test(v))S.chat.push({t:'Mau transfer ke siapa dan berapa? Ketik @ untuk memilih penerima, contoh: “transfer 400.000 ke @Budi”.'});
 else S.chat.push({t:'Maaf, di prototype ini saya baru bisa membantu transfer. Coba ketik “transfer 400.000 ke @…”.'});
 paint();focusC()}

  <button onclick="sheet('<div style=\\'text-align:center\\'><div style=\\'font-size:16px;font-weight:700;margin-bottom:8px\\'>Masih di sana?</div><div class=\\'small muted\\' style=\\'margin-bottom:18px\\'>Sesi kamu akan berakhir dalam 60 detik untuk menjaga keamanan akunmu.</div><button class=\\'btn\\' onclick=\\'closeSheet()\\'>Tetap Masuk</button><button class=\\'btn grey\\' style=\\'margin-top:8px\\' onclick=\\'closeSheet();reset(&quot;prelogin&quot;)\\'>Keluar Sekarang</button></div>',1)">Session timeout warning</button>

 <div class="g"><b>Transfer result after PIN</b>${[['success','Berhasil'],['pending','Sedang diperiksa'],['failed','Gagal'],['signal','Koneksi terputus']].map(([k,l])=>`<button class="${S.result===k?'on':''}" onclick="S.result='${k}';demo()">${l}</button>`).join('')}</div>
 <div class="g"><b>Login</b><button class="${S.bio?'on':''}" onclick="S.bio=!S.bio;paint()">Sidik jari ${S.bio?'aktif':'belum aktif'}</button></div>
 <p style="margin-top:6px">Screen: <code>${r}</code></p>`}
render();
